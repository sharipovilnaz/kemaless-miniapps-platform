global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical
      matchers:
        - severity = critical
      group_wait: 15s
      repeat_interval: 1h
      continue: true

    - receiver: warning
      matchers:
        - severity =~ "warning|error"
      continue: true

receivers:
  - name: default
    webhook_configs:
      - url: http://127.0.0.1:9/discard
        send_resolved: false

  - name: critical
    webhook_configs:
      - url: http://127.0.0.1:9/discard
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: http://127.0.0.1:9/discard
        send_resolved: false

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]
