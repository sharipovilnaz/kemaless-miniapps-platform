groups:
  - name: recording_rules
    interval: 30s
    rules:
      - record: job:http_request_rate:1m
        expr: sum by (job) (rate(http_server_requests_seconds_count[2m]))

      - record: job:http_request_latency_seconds:p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (rate(http_server_requests_seconds_bucket[5m]))
          )

      - record: job:http_error_ratio:5m
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job) (rate(http_server_requests_seconds_count[5m])), 1e-9)

      - record: delivery:couriers_available
        expr: sum(couriers_online) or vector(0)

      - record: order:active_count
        expr: sum(orders_active) or vector(0)
