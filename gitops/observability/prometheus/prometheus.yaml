global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: admin-monolith
    environment: admin-compose

rule_files:
  - /etc/prometheus/rules/alerts/*.yaml
  - /etc/prometheus/recording-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: admin-platform
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    honor_timestamps: true
    static_configs:
      - targets: [admin-platform:8080]
        labels:
          application: miniapp-platform
          service: admin

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: kafka
    scrape_interval: 30s
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: cadvisor
    scrape_interval: 20s
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
